name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check public distribution
        run: python scripts/check_public_release.py
      - name: Check clean template
        run: python novel.py doctor --template
      - name: Run release regression suite
        run: python novel.py release-test
      - name: Build distribution
        run: python scripts/build_release.py --output-dir "$RUNNER_TEMP/cosmo-release"
